name: GK-M1 deterministic tests

on:
  push:
    branches:
      - gk-m1-manuscript-bindings
    paths:
      - 'grammar/kernel/gk-m1/bindings/**'
      - 'grammar/kernel/gk-m1/measurement/**'
      - 'grammar/kernel/gk-m1/records/**'
      - 'grammar/kernel/gk-m1/tests/**'
      - '.github/workflows/gk-m1-tests.yml'
  pull_request:
    paths:
      - 'grammar/kernel/gk-m1/bindings/**'
      - 'grammar/kernel/gk-m1/measurement/**'
      - 'grammar/kernel/gk-m1/records/**'
      - 'grammar/kernel/gk-m1/tests/**'
      - '.github/workflows/gk-m1-tests.yml'

permissions:
  contents: read

jobs:
  gk-m1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run geometry and binding tests
        run: python grammar/kernel/gk-m1/tests/test_measurements.py
      - name: Run record-emitter tests
        run: python grammar/kernel/gk-m1/tests/test_records.py
      - name: Print GK-M1 manifest hashes
        shell: bash
        run: |
          cd grammar/kernel/gk-m1
          sha256sum \
            PROVENANCE.md \
            README.md \
            STATUS.md \
            TEST_RESULTS.txt \
            adapters/shared_event_contract.md \
            bindings/voynich_2r_2v_3r_gk_m1.json \
            examples/README.md \
            measurement/__init__.py \
            measurement/geometry.py \
            records/__init__.py \
            records/emitters.py \
            tests/test_measurements.py \
            tests/test_records.py \
            validation/HUMAN_VALIDATION.md \
            validation/PR_CHECKLIST.md \
            validation/REVIEW_GATE.md
