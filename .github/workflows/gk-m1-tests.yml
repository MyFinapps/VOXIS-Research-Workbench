name: GK-M1 deterministic tests

on:
  push:
    branches:
      - gk-m1-manuscript-bindings
      - feature/freeze-state-capture-v0
    paths:
      - 'grammar/kernel/gk-m1/bindings/**'
      - 'grammar/kernel/gk-m1/measurement/**'
      - 'grammar/kernel/gk-m1/records/**'
      - 'grammar/kernel/gk-m1/tests/**'
      - 'schemas/records/**'
      - '.github/workflows/gk-m1-tests.yml'
  pull_request:
    paths:
      - 'grammar/kernel/gk-m1/bindings/**'
      - 'grammar/kernel/gk-m1/measurement/**'
      - 'grammar/kernel/gk-m1/records/**'
      - 'grammar/kernel/gk-m1/tests/**'
      - 'schemas/records/**'
      - '.github/workflows/gk-m1-tests.yml'

permissions:
  contents: read

jobs:
  gk-m1:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run geometry and binding tests
        run: python grammar/kernel/gk-m1/tests/test_measurements.py
      - name: Run record-emitter tests
        run: python grammar/kernel/gk-m1/tests/test_records.py
      - name: Run FREEZE record tests
        run: python grammar/kernel/gk-m1/tests/test_freeze.py
      - name: Verify finalized GK-M1 milestone manifest
        shell: bash
        run: |
          cd grammar/kernel/gk-m1
          sha256sum -c MANIFEST.sha256
