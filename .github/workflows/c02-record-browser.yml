name: C02 record browser
on:
  push:
    paths: ['tools/record_bridge/**', '.github/workflows/c02-record-browser.yml']
  pull_request:
    paths: ['tools/record_bridge/**', '.github/workflows/c02-record-browser.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tools/record_bridge -v
